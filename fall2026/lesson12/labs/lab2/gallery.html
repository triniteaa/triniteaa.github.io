    <main class="container my-5 pt-5">
        <div class="text-center mb-4">
            <h2>Meet our rescued friends</h2>
            <p class="lead">We help rehabilitate a variety of wildlife and release them back into their natural habitat.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/squirrels.jpg" alt="small squirrel in hands" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Julian. His mother was hit by a car and we are providing care until he is old enough to be released.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/hedgehog.jpg" alt="hedgehog on grass" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Sonny. He was neglected by his owner and is now thriving in our care.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/pig.jpg" alt="pig standing in field" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Wilbur. He was abandoned and is now a permanent resident at our facility.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/owl.jpg" alt="owl perched on branch" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Hoot. He suffered a broken wing and is recovering nicely.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/deer.jpg" alt="young deer in grass" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Bambi. She was orphaned and will be released back into the wild this fall.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/horse.jpg" alt="brown horse in pasture" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Spirit. He was rescued from a neglect situation and now enjoys our green pastures.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/bearded-dragon.jpg" alt="bearded dragon on rock" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Spike. He was surrendered by an owner who could no longer care for him.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/bird.jpg" alt="small songbird on branch" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Chirp. He fell from his nest during a storm and is nearly ready for release.</figcaption>
                </figure>
            </div>

            <div class="col-md-4">
                <figure class="card h-100">
                    <img src="images/snake.jpg" alt="corn snake coiled on ground" class="card-img-top">
                    <figcaption class="card-body text-center">Meet Slither. He was injured by a lawnmower and is healing well.</figcaption>
                </figure>
            </div>
        </div>
